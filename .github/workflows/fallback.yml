name: 🛡️ Backup Sitemap Deploy (Fail-safe)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  safe-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Safe Install
        run: npm install || true

      - name: Safe Build
        run: npm run build || true

      - name: Ensure Output Exists
        run: |
          mkdir -p public
          echo "<h1>Fallback Sitemap Page</h1>" > public/index.html

      - name: Copy Sitemap If Exists
        run: |
          cp -r output/* public/ 2>/dev/null || echo "No sitemap generated"

      - name: Deploy Safe Version
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
