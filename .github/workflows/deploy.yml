name: 🚀 Auto Deploy Sitemap + Site to GitHub Pages

on:
  push:
    branches:
      - main   # ✅ auto trigger from main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build sitemap
        run: npm run build || true

      - name: Ensure frontend index exists
        run: |
          mkdir -p public

          if [ -f frontend/index.html ]; then
            cp frontend/index.html public/index.html
          else
            echo "<h1>Sitemap Generator Running</h1>" > public/index.html
          fi

      - name: Copy sitemap output
        run: |
          mkdir -p public
          cp -r output/* public/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
