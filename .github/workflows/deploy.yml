name: 🚀 Deploy Sitemap to GitHub Pages (Main)

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Build (Sitemap Generator)
        run: npm run build || echo "Build failed but continuing..."

      - name: Prepare Public Folder
        run: |
          rm -rf public
          mkdir public

          cp -r frontend/* public/ || true
          cp -r output/* public/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
