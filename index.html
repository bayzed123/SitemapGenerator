<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Sitemap Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:#e2e8f0;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
    border:1px solid #1f2937;
}

input{
    width:75%;
    padding:12px;
    border-radius:8px;
    border:none;
}

button{
    padding:12px 15px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.primary{background:#2563eb;color:white;}
.success{background:#16a34a;color:white;}
.dark{background:#334155;color:white;}

ul{
    list-style:none;
    padding:0;
}

li{
    padding:8px;
    border-bottom:1px solid #1f2937;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:40px;
    padding:20px;
    border-top:1px solid #1f2937;
}

a{color:#60a5fa;}
</style>
</head>

<body>

<div class="container">

<h1>⚡ Auto Sitemap Generator Dashboard</h1>

<div class="card">

    <input id="urlInput" placeholder="Enter website URL (https://example.com)" />
    <button class="primary" onclick="addSite()">Scan Website</button>

    <button class="dark" onclick="downloadLinks()">Download Links</button>
    <button class="success" onclick="downloadXML()">Download Sitemap XML</button>

</div>

<div class="card">
    <h3>📡 Extracted Links</h3>
    <ul id="linkList"></ul>
</div>

<div class="card">
    <h3>🧾 Sitemap Preview</h3>
    <pre id="xmlPreview" style="white-space:pre-wrap;"></pre>
</div>

</div>

<div class="footer">
    <p>
        Developer:
        <a href="https://www.sayadbayezid.com" target="_blank">
            Sayad Md Bayezid Hosan
        </a>
    </p>

    <p>
        Contributed with AI support: 
        <a href="https://openai.com" target="_blank">OpenAI ChatGPT</a>
    </p>
</div>

<script>

let links = [];

function addSite(){
    const url = document.getElementById("urlInput").value;
    if(!url) return alert("Enter URL");

    // Simulated link generation (frontend only)
    links = [
        url + "/",
        url + "/about",
        url + "/contact",
        url + "/blog",
        url + "/services"
    ];

    renderLinks();
    generateXML();
}

function renderLinks(){
    const list = document.getElementById("linkList");
    list.innerHTML = "";

    links.forEach(l=>{
        let li = document.createElement("li");
        li.innerText = l;
        list.appendChild(li);
    });
}

function generateXML(){
    let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

    links.forEach(l=>{
        xml += `
  <url>
    <loc>${l}</loc>
  </url>`;
    });

    xml += "\n</urlset>";

    document.getElementById("xmlPreview").innerText = xml;
}

function downloadLinks(){
    const blob = new Blob([links.join("\n")], {type:"text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "links.txt";
    a.click();
}

function downloadXML(){
    const xml = document.getElementById("xmlPreview").innerText;
    const blob = new Blob([xml], {type:"application/xml"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sitemap.xml";
    a.click();
}

</script>

</body>
</html>
